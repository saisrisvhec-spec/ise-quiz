<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ISE Interactive Expo Quiz</title>
  <style>
    :root {
      --blue: #2563eb;
      --violet: #7c3aed;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --green: #16a34a;
      --ink: #172033;
      --muted: #667085;
      --red: #ef4444
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #f8f1ff, #fff2f7);
      color: var(--ink);
      min-height: 100vh
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 22px
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 28px;
      background: linear-gradient(135deg, #e4f1ff, #f2eaff 55%, #ffe9f4);
      box-shadow: 0 18px 45px #4f46e51c;
      border: 1px solid #fff
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: .35
    }

    .b1 {
      width: 130px;
      height: 130px;
      background: #60a5fa;
      right: -35px;
      top: -50px
    }

    .b2 {
      width: 100px;
      height: 100px;
      background: #f472b6;
      left: -35px;
      bottom: -55px
    }

    .heroGrid {
      position: relative;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 22px;
      align-items: center
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff;
      color: #5b21b6;
      font-size: 12px;
      font-weight: 900
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.02;
      margin: 13px 0 8px;
      font-weight: 950
    }

    h1 span {
      background: linear-gradient(90deg, #2563eb, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      color: transparent
    }

    .sub {
      color: #596579;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 17px
    }

    .step {
      padding: 8px 11px;
      background: #ffffffb8;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800
    }

    .illustration {
      background: #fff;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 12px 28px #1018281c
    }

    .illustration svg {
      width: 100%;
      height: auto;
      display: block
    }

    /* Registration Form */
    .reg-form {
      background: #fff;
      border: 1px solid #e7eaf0;
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 10px 30px #1018280c;
      margin-top: 16px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 750;
      color: var(--muted);
      font-size: 13px;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e7eaf0;
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: .2s;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 4px #7c3aed20
    }

    .input-group textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e7eaf0;
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: .2s;
      resize: vertical;
    }

    .error-msg {
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
      display: none;
    }

    .input-group.error input {
      border-color: var(--red);
    }

    .input-group.error .error-msg {
      display: block;
    }

    .card {
      margin-top: 16px;
      background: #fff;
      border: 1px solid #e7eaf0;
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 10px 30px #1018280c;
      position: relative
    }

    .top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 850;
      color: var(--muted)
    }

    .progress {
      height: 10px;
      background: #edf0f5;
      border-radius: 99px;
      margin: 10px 0 20px;
      overflow: hidden
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed, #ec4899);
      transition: .3s
    }

    .qbadge {
      display: inline-block;
      padding: 6px 10px;
      background: #f1edff;
      color: #6d28d9;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900
    }

    .q {
      font-size: 22px;
      line-height: 1.4;
      font-weight: 900;
      margin: 12px 0 18px
    }

    .emoji {
      font-size: 32px;
      text-align: center;
      margin-bottom: 7px
    }

    .options {
      display: grid;
      gap: 11px
    }

    .opt {
      width: 100%;
      padding: 14px;
      border: 2px solid #e7eaf0;
      background: #fbfcfe;
      border-radius: 16px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: #283044;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: .18s
    }

    .opt:hover {
      border-color: #a78bfa;
      background: #f8f5ff;
      transform: translateY(-1px)
    }

    .opt.sel {
      border-color: #7c3aed;
      background: #f1edff;
      color: #4c1d95
    }

    .letter {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 10px;
      background: #eef1f6;
      font-weight: 900
    }

    .sel .letter {
      background: #7c3aed;
      color: white
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 19px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 14px 22px;
      font-weight: 900;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      box-shadow: 0 8px 18px #4f46e530;
      width: 100%;
      transition: .2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px #4f46e540;
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .reset {
      background: #eef1f6;
      color: #344054
    }

    .next {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      box-shadow: 0 8px 18px #4f46e530;
      flex: 1;
      min-width: 140px;
    }

    .next:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none
    }

    .btn-secondary {
      background: #eef1f6;
      color: #344054;
    }

    /* Result Page */
    .result {
      text-align: center;
      padding: 28px;
      border-radius: 26px;
      background: linear-gradient(135deg, #eef9ff, #f6efff, #fff0f7);
      border: 1px solid #e2e6f3;
      margin-top: 16px;
    }

    .trophy {
      font-size: 64px
    }

    .stars {
      font-size: 28px;
      letter-spacing: 4px
    }

    .score {
      font-size: 58px;
      font-weight: 950;
      background: linear-gradient(90deg, #2563eb, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      color: transparent;
      margin: 12px
    }

    .result h2 {
      margin: 5px;
      font-size: 27px
    }

    .result-details {
      background: #ffffffaa;
      border-radius: 16px;
      padding: 15px;
      margin: 15px auto;
      display: inline-block;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    .result-details span {
      color: var(--violet)
    }

    .note {
      color: var(--muted);
      margin: 5px auto 20px;
      max-width: 550px;
      font-size: 14px;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Answers Review */
    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .ans-review {
      text-align: left;
      margin-bottom: 15px;
      padding: 18px;
      border-radius: 20px;
      background: #fff;
      border: 2px solid #e7eaf0;
    }

    .ans-review.correct {
      border-color: #16a34a40;
      background: #f0fdf4;
    }

    .ans-review.wrong {
      border-color: #ef444440;
      background: #fef2f2;
    }

    .ans-q {
      font-weight: 800;
      margin-bottom: 12px;
      font-size: 16px;
      color: #1e293b;
    }

    .ans-det {
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .ans-det.correct-text {
      color: #16a34a;
    }

    .ans-det.wrong-text {
      color: #ef4444;
    }

    .icon-badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
    }

    .api-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }

    .api-status.loading {
      display: block;
      background: #eef1f6;
      color: #475467;
    }

    .api-status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .api-status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .footer {
      text-align: center;
      color: #667085;
      font-size: 11px;
      padding: 15px;
      margin-top: 20px;
    }

    /* Loader */
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--violet);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media(max-width:650px) {
      .heroGrid {
        grid-template-columns: 1fr
      }

      .illustration {
        max-width: 280px;
        margin: auto
      }

      h1 {
        font-size: 35px
      }

      .q {
        font-size: 19px
      }

      .wrap {
        padding: 12px
      }

      .result-actions {
        flex-direction: column;
      }

      .result-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Dynamic Content Container -->
    <div id="app"></div>
    <div class="footer">ISE • Interactive Skills Enhancer • Science Expo</div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    // IMPORTANT: Paste your deployed Google Apps Script Web App URL below
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1YMrSFx3dAkkdixIctqmJMoMpICFo03ZtcvgzwtJ-iGxcxYmsCrnIjWL219LrC8EbhA/exec";

    // ==========================================
    // QUIZ DATA
    // ==========================================
    const questions = [
      { q: "ISE-ல் குழந்தையின் starting level-ஐ கண்டறிய பயன்படுத்தப்படுவது எது?", o: ["Progress Dashboard", "Emotion Recognition", "Baseline Test", "Accessibility Toggle"], a: [2], e: "📝" },
      { q: "ISE-ன் adaptive logic, குழந்தையின் performance அடிப்படையில் difficulty-ஐ எப்படி கையாள்கிறது?", o: ["ஒவ்வொரு முறையும் manually reset செய்கிறது", "Real time-ல் adjust செய்கிறது", "எப்போதும் ஒரே level-ல் வைத்திருக்கிறது", "Dashboard-ஐ மட்டும் மாற்றுகிறது"], a: [1], e: "⚙️" },
      { q: "ISE-ல் core skill-building activity-ஆக குறிப்பிடப்பட்டிருப்பது எது?", o: ["Routine Planner", "Emotion Recognition", "AR/VR Training", "IEP Tracker"], a: [1], e: "😊" },
      { q: "ISE Progress Dashboard யாருக்கு குழந்தையின் progress-ஐ புரிந்துகொள்ள உதவுகிறது?", o: ["Parents மட்டும்", "Teachers மட்டும்", "Therapists மட்டும்", "Parents, teachers and therapists"], a: [3], e: "📊" },
      { q: "ISE-ன் current accessibility features-ல் எவை உள்ளன? எல்லா சரியானவற்றையும் தேர்வு செய்யுங்கள்.", o: ["Sound on/off", "AR/VR mode", "Offline mode", "Font size adjustment"], a: [0, 3], multi: true, e: "♿" }
    ];

    // ==========================================
    // STATE
    // ==========================================
    let state = {
      view: 'register', // 'register', 'quiz', 'result', 'review', 'feedback'
      participant: {
        name: '',
        email: ''
      },
      currentQuestion: 0,
      answers: [],
      score: 0,
      apiStatus: '', // '', 'loading', 'success', 'error', 'duplicate'
      apiMessage: ''
    };

    const app = document.getElementById("app");

    // ==========================================
    // RENDERING VIEWS
    // ==========================================
    function render(scrollToTop = true) {
      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (state.view === 'register') {
        app.innerHTML = renderHero() + renderRegistration();
        attachRegistrationListeners();
      } else if (state.view === 'quiz') {
        app.innerHTML = renderHero() + renderQuiz();
        attachQuizListeners();
      } else if (state.view === 'result') {
        app.innerHTML = renderHero() + renderResult();
        attachResultListeners();
      } else if (state.view === 'review') {
        app.innerHTML = renderReview();
        attachReviewListeners();
      } else if (state.view === 'feedback') {
        app.innerHTML = renderFeedback();
        attachFeedbackListeners();
      }
    }

    // Hero Section (Shared)
    function renderHero() {
      return `
    <section class="hero">
      <div class="blob b1"></div><div class="blob b2"></div>
      <div class="heroGrid">
        <div>
          <div class="badge">✨ SCIENCE EXPO • ISE CHALLENGE</div>
          <h1>How well do you know <span>ISE?</span> 🧠💙</h1>
          <div class="sub">Welcome to the ISE Challenge! Discover and test your knowledge about our Interactive Skills Enhancer.</div>
          <div class="steps"><div class="step">📝 Assess</div><div class="step">🎮 Engage</div><div class="step">⚙️ Adapt</div><div class="step">📊 Report</div></div>
        </div>
        <div class="illustration">
          <svg viewBox="0 0 360 250" role="img" aria-label="Inclusive learning illustration">
            <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
            <rect width="360" height="250" rx="20" fill="#f7f9ff"/>
            <circle cx="75" cy="75" r="31" fill="#ffd3b6"/><path d="M44 72c3-40 63-43 63 2-12-10-24-15-40-10-8 2-14 6-23 8z" fill="#453b63"/>
            <path d="M48 112q27-24 54 0v57H48z" fill="#60a5fa"/><circle cx="285" cy="77" r="31" fill="#ffd3b6"/><path d="M255 70q5-43 63-25l8 34c-20-11-37-14-71-9z" fill="#3f3d56"/><path d="M258 112q27-24 54 0v57h-54z" fill="#f472b6"/>
            <rect x="118" y="52" width="124" height="91" rx="16" fill="url(#g)"/><rect x="129" y="63" width="102" height="65" rx="10" fill="#fff"/>
            <circle cx="160" cy="92" r="13" fill="#fde68a"/><circle cx="200" cy="92" r="13" fill="#bbf7d0"/><path d="M151 112q10-12 20 0M191 112q10-12 20 0" fill="none" stroke="#475467" stroke-width="3" stroke-linecap="round"/>
            <path d="M126 151h109" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
            <circle cx="180" cy="191" r="31" fill="#ede9fe"/><text x="180" y="202" text-anchor="middle" font-size="30">🧠</text>
            <text x="180" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#475467">LEARN • ADAPT • GROW</text>
          </svg>
        </div>
      </div>
    </section>
  `;
    }

    // 1. Registration View
    function renderRegistration() {
      return `
    <section class="reg-form">
      <h2 style="margin-top:0;">Participant Registration</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Enter your details to begin the assessment.</p>
      
      <div class="input-group" id="name-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="e.g. Arun Kumar" value="${state.participant.name}">
        <div class="error-msg">Please enter your name.</div>
      </div>
      
      <div class="input-group" id="email-group">
        <label>Email ID</label>
        <input type="email" id="reg-email" placeholder="e.g. example@gmail.com" value="${state.participant.email}">
        <div class="error-msg">Please enter a valid email address.</div>
      </div>
      
      <button class="btn btn-primary" id="btn-start" style="margin-top:10px;">Start Test ➜</button>
    </section>
  `;
    }

    function attachRegistrationListeners() {
      document.getElementById('btn-start').onclick = () => {
        const nameInput = document.getElementById('reg-name').value.trim();
        const emailInput = document.getElementById('reg-email').value.trim();

        let valid = true;

        if (!nameInput) {
          document.getElementById('name-group').classList.add('error');
          valid = false;
        } else {
          document.getElementById('name-group').classList.remove('error');
        }

        // Basic email validation regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailInput)) {
          document.getElementById('email-group').classList.add('error');
          valid = false;
        } else {
          document.getElementById('email-group').classList.remove('error');
        }

        if (valid) {
          state.participant.name = nameInput;
          state.participant.email = emailInput;
          state.currentQuestion = 0;
          state.answers = [];
          state.view = 'quiz';
          render();
        }
      };
    }

    // 2. Quiz View
    function renderQuiz() {
      const i = state.currentQuestion;
      const x = questions[i];
      const chosen = state.answers[i] || [];

      const optionsHtml = x.o.map((v, n) =>
        `<button class="opt ${chosen.includes(n) ? "sel" : ""}" data-n="${n}">
      <span class="letter">${String.fromCharCode(65 + n)}</span>
      <span>${v}</span>
    </button>`
      ).join("");

      const isLast = i === questions.length - 1;
      const nextText = isLast ? "🏆 Finish Quiz" : "Next ➜";

      return `
    <section class="card">
      <div class="top">
        <span>🚀 ISE QUIZ</span>
        <span>${i + 1} / ${questions.length}</span>
      </div>
      <div class="progress">
        <div class="bar" style="width:${(i + 1) / questions.length * 100}%"></div>
      </div>
      <div class="qbadge">QUESTION ${i + 1} ✨ ${x.multi ? "(Multiple Select)" : ""}</div>
      <div class="emoji">${x.e} 💡 🎯</div>
      <div class="q">${x.q}</div>
      <div class="options">${optionsHtml}</div>
      
      <div class="actions">
        <button class="btn reset" id="btn-back" ${i === 0 ? 'style="visibility:hidden"' : ''}>⬅️ Back</button>
        <button class="btn next" id="btn-next" ${chosen.length ? "" : "disabled"}>${nextText}</button>
      </div>
    </section>
  `;
    }

    function attachQuizListeners() {
      const x = questions[state.currentQuestion];

      document.querySelectorAll(".opt").forEach(b => {
        b.onclick = () => {
          let n = +b.dataset.n;
          if (x.multi) {
            let a = [...(state.answers[state.currentQuestion] || [])];
            if (a.includes(n)) {
              a = a.filter(v => v !== n);
            } else {
              a.push(n);
            }
            state.answers[state.currentQuestion] = a.sort((a, b) => a - b);
          } else {
            state.answers[state.currentQuestion] = [n];
          }
          render(false);
        };
      });

      const btnNext = document.getElementById("btn-next");
      if (btnNext) {
        btnNext.onclick = () => {
          if (state.currentQuestion < questions.length - 1) {
            state.currentQuestion++;
            render();
          } else {
            finishQuiz();
          }
        };
      }

      const btnBack = document.getElementById("btn-back");
      if (btnBack) {
        btnBack.onclick = () => {
          if (state.currentQuestion > 0) {
            state.currentQuestion--;
            render();
          }
        };
      }
    }

    // 3. Quiz Completion & Submission Logic
    function finishQuiz() {
      // Calculate score
      let score = 0;
      questions.forEach((x, n) => {
        let got = state.answers[n] || [];
        if (got.length === x.a.length && got.every(v => x.a.includes(v))) {
          score++;
        }
      });
      state.score = score;
      state.view = 'result';
      state.apiStatus = 'loading';
      render();

      submitToGoogleSheets();
    }

    async function submitToGoogleSheets() {
      if (GOOGLE_SCRIPT_URL === "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
        state.apiStatus = 'error';
        state.apiMessage = "Google Sheets integration is not configured. Setup the API URL.";
        render();
        return;
      }

      // Prepare payload
      const percentage = Math.round((state.score / questions.length) * 100);

      const detailedAnswers = questions.map((x, n) => {
        const got = state.answers[n] || [];
        const isCorrect = (got.length === x.a.length && got.every(v => x.a.includes(v)));
        return {
          qNum: "Q" + (n + 1),
          question: x.q,
          selected: got.map(idx => String.fromCharCode(65 + idx) + " - " + x.o[idx]).join(", ") || "None",
          correct: x.a.map(idx => String.fromCharCode(65 + idx) + " - " + x.o[idx]).join(", "),
          isCorrect: isCorrect
        };
      });

      const payload = {
        name: state.participant.name,
        email: state.participant.email,
        score: state.score,
        totalQuestions: questions.length,
        percentage: percentage,
        answers: detailedAnswers
      };

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          // mode: 'no-cors' would not return JSON body. 
          // We expect the Apps script to handle CORS and return valid JSON
          body: JSON.stringify(payload),
          headers: {
            "Content-Type": "text/plain;charset=utf-8", // text/plain used to avoid preflight issues in GAS
          }
        });

        const result = await res.json();
        if (result.success) {
          state.apiStatus = 'success';
          state.apiMessage = "Result successfully saved!";
        } else if (result.duplicate) {
          state.apiStatus = 'duplicate';
          state.apiMessage = "⚠️ This email has already completed the test.";
        } else {
          state.apiStatus = 'error';
          state.apiMessage = "Couldn't save to database. " + (result.error || "");
        }
      } catch (error) {
        state.apiStatus = 'error';
        state.apiMessage = "Network error: Your test is completed, but we couldn't save your response. Please try submitting again.";
      }
      render();
    }

    // 4. Result View
    function renderResult() {
      const percentage = Math.round((state.score / questions.length) * 100);
      let title = percentage === 100 ? "Outstanding!" : percentage >= 80 ? "Excellent!" : percentage >= 60 ? "Great Job!" : "Keep Exploring!";
      let stars = percentage === 100 ? "★★★★★" : percentage >= 80 ? "★★★★☆" : percentage >= 60 ? "★★★☆☆" : "★★☆☆☆";

      let apiHtml = '';
      if (state.apiStatus === 'loading') {
        apiHtml = `<div class="api-status loading"><span class="loader"></span> Saving your result securely...</div>`;
      } else if (state.apiStatus === 'success') {
        apiHtml = `<div class="api-status success">✅ ${state.apiMessage}</div>`;
      } else if (state.apiStatus === 'error') {
        apiHtml = `<div class="api-status error">❌ ${state.apiMessage} <br><button id="btn-retry" style="margin-top:8px;padding:4px 8px;border-radius:4px;border:none;cursor:pointer;background:#ef4444;color:white;font-weight:bold;">Retry Submit</button></div>`;
      } else if (state.apiStatus === 'duplicate') {
        apiHtml = `<div class="api-status error" style="background:#fffbeb;color:#b45309;border:1px solid #fcd34d;">${state.apiMessage}</div>`;
      }

      return `
    <section class="result">
      <div class="trophy">🎉</div>
      <div class="stars">${stars}</div>
      <h2>Test Completed!</h2>
      
      <div class="result-details">
        <div>Name: <span>${state.participant.name}</span></div>
        <div>Email: <span>${state.participant.email}</span></div>
      </div>
      
      <div class="score">${state.score} / ${questions.length}</div>
      <h3 style="margin:0 0 10px 0; color:var(--violet)">${percentage}% - ${title}</h3>
      
      ${apiHtml}

      <div class="result-actions" style="margin-top:25px;">
        <button class="btn btn-secondary" id="btn-view-answers">🔍 View Answers</button>
        <button class="btn btn-primary" id="btn-retake">🔄 Retake Test</button>
        <button class="btn btn-secondary" id="btn-feedback">💬 Give Feedback</button>
      </div>
    </section>
  `;
    }

    function attachResultListeners() {
      document.getElementById('btn-view-answers').onclick = () => {
        state.view = 'review';
        render();
      };

      document.getElementById('btn-feedback').onclick = () => {
        state.view = 'feedback';
        render();
      };

      document.getElementById('btn-retake').onclick = () => {
        // Only allow retake if not duplicate or if we want to allow it anyway.
        // Based on requirements, if duplicate is blocked, they can view answers, but retaking with same email will just block them on submit.
        // We will reset completely to register page to allow a new user or new email.
        state.participant.name = '';
        state.participant.email = '';
        state.currentQuestion = 0;
        state.answers = [];
        state.score = 0;
        state.apiStatus = '';
        state.view = 'register';
        render();
      };

      const btnRetry = document.getElementById('btn-retry');
      if (btnRetry) {
        btnRetry.onclick = () => {
          state.apiStatus = 'loading';
          render();
          submitToGoogleSheets();
        };
      }
    }

    // 5. Answer Review View
    function renderReview() {
      let html = `<section class="card" style="max-width:900px; margin:auto; margin-top:20px;">
    <div class="review-header">
      <h2 style="margin:0;">Answer Review</h2>
      <button class="btn btn-secondary" id="btn-back-result" style="padding:10px 15px;">⬅️ Back to Result</button>
    </div>
  `;

      questions.forEach((x, n) => {
        const got = state.answers[n] || [];
        const isCorrect = (got.length === x.a.length && got.every(v => x.a.includes(v)));

        const selectedStr = got.length > 0 ? got.map(idx => String.fromCharCode(65 + idx) + " — " + x.o[idx]).join("<br>") : "None";
        const correctStr = x.a.map(idx => String.fromCharCode(65 + idx) + " — " + x.o[idx]).join("<br>");

        const statusClass = isCorrect ? 'correct' : 'wrong';
        const icon = isCorrect ? '✅' : '❌';

        html += `
      <div class="ans-review ${statusClass}">
        <div class="ans-q">Question ${n + 1}: ${x.q}</div>
        <div class="ans-det ${isCorrect ? 'correct-text' : 'wrong-text'}">
          <strong>Your Answer:</strong><br> ${selectedStr} ${icon}
        </div>
        ${!isCorrect ? `
          <div class="ans-det correct-text" style="margin-top:10px;">
            <strong>Correct Answer:</strong><br> ${correctStr} ✅
          </div>
        ` : ''}
      </div>
    `;
      });

      html += `</section>`;
      return html;
    }

    function attachReviewListeners() {
      document.getElementById('btn-back-result').onclick = () => {
        state.view = 'result';
        render();
      };
    }

    // 6. Feedback View
    function renderFeedback() {
      return `
    <section class="card" style="max-width:900px; margin:auto; margin-top:20px;">
      <div class="review-header">
        <h2 style="margin:0;">Project Feedback</h2>
        <button class="btn btn-secondary" id="btn-back-result-fb" style="padding:10px 15px;">⬅️ Back to Result</button>
      </div>
      <p style="color:var(--muted); font-size:14px; margin-bottom: 20px;">
        What do you think about our project, and what can we do to improve it?
      </p>
      <div class="input-group">
        <textarea id="feedback-text" rows="6" placeholder="Write your thoughts here..."></textarea>
      </div>
      <button class="btn btn-primary" id="btn-submit-fb" style="width: auto;">Submit Feedback</button>
      <div id="fb-status" class="api-status"></div>
    </section>
  `;
    }

    function attachFeedbackListeners() {
      document.getElementById('btn-back-result-fb').onclick = () => {
        state.view = 'result';
        render();
      };
      
      document.getElementById('btn-submit-fb').onclick = () => {
        const text = document.getElementById('feedback-text').value.trim();
        const statusDiv = document.getElementById('fb-status');
        if (!text) {
          statusDiv.className = 'api-status error';
          statusDiv.innerHTML = '❌ Please enter your feedback before submitting.';
          return;
        }
        
        statusDiv.className = 'api-status success';
        statusDiv.innerHTML = '✅ Thank you for your valuable feedback!';
        document.getElementById('feedback-text').value = '';
      };
    }

    // Initialize
    render();
  </script>
</body>

</html>
